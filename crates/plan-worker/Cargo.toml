[package]
name = "plan-worker"
license = "AGPL-3.0-only"
version = "0.1.0"
edition = "2021"
description = "VISOR planner in a Web Worker: route-core off the browser's main thread (built by Trunk from app/index.html)"

[dependencies]
route-core = { path = "../route-core", features = ["json"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent"] }
console_error_panic_hook = "0.1.7"
