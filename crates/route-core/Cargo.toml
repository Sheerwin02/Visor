[package]
name = "route-core"
license = "AGPL-3.0-only"
version = "0.1.0"
edition = "2021"
description = "VISOR loop planner: the route rule of tools/route.py (option d), in Rust, shared by the web app"

[features]
# JSON forms of Rules and Plan, for the web app and its planner worker (crates/plan-worker)
json = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
terrain-core = { path = "../terrain-core" }  # reference ray march for light.rs tests
